[package]
name = "seer-classic"
version = "0.3.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
log = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The packaged smoke test's build (src-tauri/src/smoke.rs, tools/distribution/smoke_macos.py); never in a release.
smoke = ["dep:objc2"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
